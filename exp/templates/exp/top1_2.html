<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/examine1.css') }}"/>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <style>
        #scenario_descriptions p {
            display: flex;
            align-items: flex-start;
            text-align: left !important;
            width: 100%;
        }
        #scenario_descriptions label {
            text-align: left !important;
            display: inline-block !important;
            width: calc(100% - 30px);
        }
        #scenario_descriptions .checks {
            margin-right: 2%;
            margin-top: 0.3%;
            flex-shrink: 0;
        }
        #already_participated_msg { display: none; color: red; font-weight: bold; }
    </style>
    <script>
        // ページ読み込み時にパスも/expに見せかける（履歴は残さない・リロード/直リンクは影響なし）
        window.addEventListener('DOMContentLoaded', function() {
            try {
                const fakePathUrl = window.location.protocol + '//' + window.location.host + '/exp';
                window.history.replaceState({}, document.title, fakePathUrl);
                console.log('top1_2: パスを/expに見せかけました');
            } catch (e) {
                console.error('top1_2: パス書き換え失敗:', e);
            }
        });
        
        // ページ読み込み時に実行
        window.onload = async function() {
            // ユーザーID生成/取得関数（utilities.jsと統一）
            function generateUniqueId() {
                // より強力な一意性を保証するため、複数の要素を組み合わせ
                const timestamp = Date.now().toString(36);
                const randomPart1 = Math.random().toString(36).substr(2, 6);
                const randomPart2 = Math.random().toString(36).substr(2, 4);
                const performanceNow = performance.now().toString(36).substr(2, 4);
                
                return `${timestamp}${randomPart1}${randomPart2}${performanceNow}`;
            }
            
            /**
             * ユーザーIDの妥当性を検証
             * @param {string} userId - 検証するユーザーID
             * @returns {boolean} IDが有効かどうか
             */
            function validateUserId(userId) {
                if (!userId) return false;
                
                // 基本的な長さチェック（最小3文字、最大50文字）
                if (userId.length < 3 || userId.length > 50) return false;
                
                // 危険な文字の除外（SQLインジェクション、XSS対策）
                const dangerousChars = /[<>'"&=;()|]/;
                if (dangerousChars.test(userId)) return false;
                
                // 制御文字の除外
                if (/[\x00-\x1F\x7F]/.test(userId)) return false;
                
                return true;
            }
            
            /**
             * ユーザーIDをサニタイズ
             * @param {string} userId - サニタイズするユーザーID
             * @returns {string} サニタイズされたユーザーID
             */
            function sanitizeUserId(userId) {
                if (!userId) return '';
                
                // 基本的なサニタイズ
                return userId
                    .toString()
                    .trim()
                    .substring(0, 50) // 最大長制限
                    .replace(/[<>'"&=;()|]/g, '') // 危険な文字を削除
                    .replace(/[\x00-\x1F\x7F]/g, ''); // 制御文字を削除
            }
            
            /**
             * ユーザーIDをストレージに保存（検証付き）
             * @param {string} userId - 保存するユーザーID
             * @param {boolean} persistent - 永続化するかどうか
             * @returns {string|null} 保存されたユーザーIDまたはnull
             */
            function saveUserId(userId, persistent = false) {
                // ユーザーIDの検証
                if (!validateUserId(userId)) {
                    console.error('Invalid user ID cannot be saved:', userId);
                    return null;
                }
                
                const sanitizedId = sanitizeUserId(userId);
                
                try {
                    sessionStorage.setItem('exp_user_id', sanitizedId);
                    
                    if (persistent) {
                        localStorage.setItem('exp_user_id_persistent', sanitizedId);
                    }
                    
                    return sanitizedId;
                } catch (error) {
                    console.error('Failed to save user ID to storage:', error);
                    return null;
                }
            }
            
            function getOrCreateUserId(options = {}) {
                const { 
                    urlParam = true, 
                    persistent = false 
                } = options;
                
                // URLからのID取得を試みる（検証付き）
                if (urlParam) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const rawId = urlParams.get('id');
                    
                    // URLパラメータを隠す（アドレスバーから除去）
                    try {
                        const cleanUrl = window.location.protocol + '//' + 
                                        window.location.host + 
                                        window.location.pathname;
                        window.history.replaceState({}, document.title, cleanUrl);
                        console.log('URLパラメータを非表示にしました');
                    } catch (error) {
                        console.error('URLパラメータの非表示に失敗しました:', error);
                    }
                    
                    if (rawId) {
                        const sanitizedId = sanitizeUserId(rawId);
                        if (validateUserId(sanitizedId)) {
                            const savedId = saveUserId(sanitizedId, persistent);
                            if (savedId) return savedId;
                        } else {
                            console.warn('Invalid user ID detected from URL:', rawId);
                        }
                    }
                }
                
                // セッションストレージから取得を試みる（検証付き）
                try {
                    const sessionId = sessionStorage.getItem('exp_user_id');
                    if (sessionId && validateUserId(sessionId)) {
                        return sessionId;
                    } else if (sessionId) {
                        // 無効なIDはクリア
                        sessionStorage.removeItem('exp_user_id');
                        console.warn('Invalid user ID found in session storage, cleared');
                    }
                } catch (error) {
                    console.warn('Failed to access session storage:', error);
                }
                
                // 永続ストレージから取得を試みる（検証付き）
                if (persistent) {
                    try {
                        const localId = localStorage.getItem('exp_user_id_persistent');
                        if (localId && validateUserId(localId)) {
                            return saveUserId(localId, true) || localId;
                        } else if (localId) {
                            // 無効なIDはクリア
                            localStorage.removeItem('exp_user_id_persistent');
                            console.warn('Invalid user ID found in local storage, cleared');
                        }
                    } catch (error) {
                        console.warn('Failed to access local storage:', error);
                    }
                }
                
                // 新規IDを生成
                const newId = generateUniqueId();
                return saveUserId(newId, persistent) || newId;
            }
            
            // サーバーから実験経路を取得する関数
            async function fetchExperimentPath(userId, reallocate = false) {
                try {
                    console.log(`実験経路を取得中: ユーザーID=${userId}, reallocate=${reallocate}`);
                    // reallocateパラメータを明示的に設定
                    const response = await fetch(`/getExperimentPath?user_id=${encodeURIComponent(userId)}&reallocate=${reallocate}`);
                    
                    if (!response.ok) {
                        throw new Error(`サーバーエラー: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('実験経路取得結果:', data);
                    
                    return data.pathType || 'order1';
                } catch (error) {
                    console.error('実験経路の取得に失敗しました:', error);
                    alert('実験経路の取得中にエラーが発生しました。ページをリロードして再試行してください。');
                    // エラー時はデフォルトの順序を返す
                    return 'order1';
                }
            }
            
            try {
                // ユーザーIDを取得または生成
                const userId = getOrCreateUserId({ persistent: true });
                console.log('ユーザーID:', userId);
                
                // 実験経路を取得
                const experimentPath = await fetchExperimentPath(userId);
                console.log('実験経路:', experimentPath);
                
                // 経路に基づいて最初の実験ページを決定
                let firstExperimentPage;
                if (experimentPath === 'order1') {
                    // order1: eXaMinE1 → eXaM1nE_2 → Ex2
                    firstExperimentPage = '/eXaMinE1';
                    console.log('経路order1を適用: 最初のページは /eXaMinE1');
                } else {
                    // order2: eXaM1nE_2 → eXaMinE1 → Ex2
                    firstExperimentPage = '/eXaM1nE_2';
                    console.log('経路order2を適用: 最初のページは /eXaM1nE_2');
                }
                
                // フォームにイベントリスナーを追加（送信前に遷移先変更）
                document.getElementById('experiment-form').addEventListener('submit', function(e) {
                    e.preventDefault(); // デフォルトの送信をキャンセル

                    // ページ遷移前に警告を解除
                    window.onbeforeunload = null;

                    // 実験ページに遷移（ユーザーIDをURLパラメータに付与）
                    const url = `${firstExperimentPage}?id=${encodeURIComponent(userId)}`;
                    console.log(`遷移先: ${url}`);
                    window.location.href = url;
                });
            } catch (err) {
                console.error('初期化エラー:', err);
                alert('初期化中にエラーが発生しました。ページをリロードして再試行してください。');
            }
        };
        
        // チェックボックスの確認（統一化された関数）
        function check_agreement2() {
            // 共通化されたチェックボックス確認ロジック
            validateCheckboxesHTML("checks", "button");
        }
        
        // チェックボックス確認の共通関数（HTML内で使用）
        function validateCheckboxesHTML(checkboxClass, targetButtonId) {
            const checkboxes = document.getElementsByClassName(checkboxClass);
            let checkedCount = 0;
            
            for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {
                    checkedCount++;
                }
            }
            
            const targetButton = document.getElementById(targetButtonId);
            if (targetButton) {
                if (checkedCount === checkboxes.length) {
                    targetButton.removeAttribute("disabled");
                } else {
                    targetButton.setAttribute("disabled", true);
                }
            }
        }

        // --- 参加済み判定・制限ロジック ---
        function setAlreadyParticipatedFlag() {
            try {
                // LocalStorage: 参加済みフラグ
                localStorage.setItem('already_participated', '1');
            } catch (e) {}
            // Cookie: simple_flag=true
            document.cookie = 'simple_flag=true; path=/; SameSite=Lax';
        }

        function hasAlreadyParticipated() {
            // LocalStorage判定
            try {
                if (localStorage.getItem('already_participated')) return true;
            } catch (e) {}
            // Cookie判定
            if (document.cookie.split(';').some(c => c.trim().startsWith('simple_flag='))) return true;
            return false;
        }

        function hideParticipationUI() {
            // 参加ボタンやフォームを非表示にする
            const btn = document.getElementById('participate_btn');
            if (btn) btn.style.display = 'none';
            // 参加不可メッセージ表示（必要に応じて）
            const msg = document.getElementById('already_participated_msg');
            if (msg) msg.style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', function() {
            if (hasAlreadyParticipated()) {
                hideParticipationUI();
            } else {
                // 初回アクセス時はフラグをセット
                setAlreadyParticipatedFlag();
            }
        });
    </script>
    <script type="module">
      import { disableSelectionAndCopy } from "../static/javascript/utilities.js";
      disableSelectionAndCopy();
    </script>
</head>

<body>
    <div id="start_area">
        <h2 id="start_message">実験開始ページ</h2>
    </div>

    <div id="when_agreeing" style="margin: 20px auto; width: 90%; max-width: 800px;">
        <h3>ありがとうございます。</h3>
        <p>以下の文章を読んで、回答ページに進んで下さい。</p>
        <p>それぞれの項目を読んだら左側のチェックボックスをチェックしてください。</p>

        <div id="scenario_descriptions" style="margin: 20px auto; text-align: left; padding: 10px;">
            <form action="/step/0" method="post">
                <!-- CSRFトークン削除済み -->
                <input type="hidden" name="step_id" value="0">
                <p>
                    <input class="checks" type="checkbox" id="checkbox1" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label for="checkbox1">これから行う実験は、12個のシナリオで構成されています。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox2" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox2">2つの出来事がどれくらい共に起きるかに関する観察データが提示されます。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox3" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox3">それらをみて、2つの出来事の因果関係の強さを推定していただきます。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox4" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox4">なお、これから提示されるシナリオは架空のものであり、実在の人物や物事などと関係はありません。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox5" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox5">回答中のメモなどはお控えください。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox6" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox6">また、実験中はブラウザの「戻る」ボタンを使用しないでください。
                    </label>
                </p>
            </form>
        </div>
    </div>

    <div style="margin: 30px auto; text-align: center;">
        <form id="experiment-form" style="display: inline-block;">
            <input type="submit" id='button' value="回答を開始する" disabled class="btn">
        </form>
    </div>

    <div style="margin-bottom: 30px;"></div>
</body>
</html>
