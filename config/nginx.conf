# UCS vs CS 認知実験用 Nginx設定 (最適化版)
# 参加者200-300人、同時接続最大30人対応
# 最終更新: 2025-06-14
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 認知実験に最適化されたリソース設定
worker_rlimit_nofile 2048;

events {
  # 30人同時接続 + JavaScript同時読み込み対応
  worker_connections 512;
  # 効率的な接続処理（Linux環境用）
  use epoll;
  multi_accept on;
  # 低負荷環境のため accept_mutex は有効
  accept_mutex on;
}

http {
  # 基本設定
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  # ログ形式（認知実験に最適化 - 必要な情報のみ）
  log_format experiment '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent rt=$request_time '
                       'exp_session="$cookie_session_id"';
  
  access_log /var/log/nginx/experiment_access.log experiment;
  
  # パフォーマンス最適化（認知実験向け調整）
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30;
  keepalive_requests 100;
  types_hash_max_size 2048;
  types_hash_bucket_size 128;
  
  # 基本セキュリティヘッダー（シンプル化）
  server_tokens off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  
  # レート制限（認知実験に最適化 - JavaScript依存関係読み込み対応）
  # 制限値をさらに大幅に緩和
  limit_req_zone $binary_remote_addr zone=experiment:10m rate=500r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;
  limit_req_zone $binary_remote_addr zone=submit:5m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=js_modules:10m rate=2000r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  # バックエンド定義（追加）
  upstream experiment_backend {
    server 127.0.0.1:9876; # 必要に応じてポートやアドレスを修正
  }

  # 接続制限（大幅緩和）
  limit_conn addr 1000;

  # --- 一時的に全制限を無効化したい場合は下記をコメントアウト ---
  # limit_req_zone $binary_remote_addr zone=experiment:10m rate=500r/s;
  # limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;
  # limit_req_zone $binary_remote_addr zone=submit:5m rate=100r/s;
  # limit_req_zone $binary_remote_addr zone=js_modules:10m rate=2000r/s;
  # limit_conn_zone $binary_remote_addr zone=addr:10m;
  # limit_conn addr 1000;
  # 各location内の limit_req/limit_conn も同様にコメントアウト可
  # ------------------------------------------------------------

  server {
    listen 80;
    server_name _;
    # ...必要に応じて server_name を修正...

    location / {
      limit_req zone=experiment burst=100 nodelay; # burst値を大きく
      proxy_pass http://experiment_backend;
      
      # 実験データの保護（キャッシュ制御）
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }
    
    # データ送信エンドポイント（厳格な制限だが緩和）
    location ~ ^/(send|send_imc)$ {
      limit_req zone=submit burst=20 nodelay;
      proxy_pass http://experiment_backend;
      
      # データ送信の最適化
      proxy_buffering off;
      add_header Cache-Control "no-cache" always;
    }
    
    # API エンドポイント（実験制御用）
    location ~ ^/(getSampleType|getExperimentPath|setSampleType)$ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://experiment_backend;
      
      # APIレスポンスの最適化
      add_header Cache-Control "no-cache" always;
    }
    
    # ヘルスチェック（制限なし）
    location /health {
      access_log off;
      proxy_pass http://experiment_backend/health;
      
      # ヘルスチェック専用設定
      proxy_connect_timeout 2s;
      proxy_send_timeout 2s;
      proxy_read_timeout 2s;
    }
    
    # 静的ファイル（認知実験用アセット + モジュール対応）
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
      limit_req zone=js_modules burst=300 nodelay;
      proxy_pass http://experiment_backend;
      
      # 静的ファイルのキャッシュ（実験期間中は適度に）
      expires 60m;
      add_header Cache-Control "public, no-transform";
      
      # 圧縮
      gzip_static on;
      
      # セキュリティ
      add_header X-Content-Type-Options "nosniff" always;
    }
    
    # エラーページ（実験環境向け）
    error_page 403 /error/403.html;
    error_page 404 /error/404.html;
    error_page 429 /error/429.html;
    error_page 500 502 503 504 /error/500.html;
    
    # カスタムエラーページの処理
    location ~* ^/error/ {
      internal;
      proxy_pass http://experiment_backend;
      add_header Cache-Control "no-cache" always;
    }
    
    location = /50x.html {
      root /usr/share/nginx/html;
    }
    
    # 実験統計・監視エンドポイント（IP制限推奨）
    location /admin {
      # 本番環境では管理者IPに制限
      # allow 192.168.1.0/24;
      # allow 10.0.0.0/8;
      # deny all;
      limit_req zone=experiment burst=20 nodelay;
      proxy_pass http://experiment_backend;
      
      # 管理画面の保護
      add_header X-Admin-Access "monitored" always;
      add_header Cache-Control "no-cache, no-store" always;
    }
  }
  
  # SSL設定（本番環境用 - Let's Encrypt推奨）
  # server {
  #   listen 443 ssl http2;
  #   server_name your-experiment-domain.com;
  #   
  #   # SSL証明書設定
  #   ssl_certificate /etc/letsencrypt/live/your-domain/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
  #   
  #   # SSL設定（認知実験用最適化）
  #   ssl_session_cache shared:SSL:10m;
  #   ssl_session_timeout 10m;
  #   ssl_session_tickets off;
  #   
  #   # 現代的な暗号化設定
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  #   ssl_prefer_server_ciphers off;
  #   
  #   # セキュリティヘッダー
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  #   add_header X-Experiment-Secure "enabled" always;
  #   
  #   # HTTP/2 Push（実験用リソース）
  #   location = / {
  #     http2_push /static/css/examine1.css;
  #     http2_push /static/javascript/examine1.js;
  #   }
  #   
  #   # 上記のlocation設定をここにも適用
  #   include /etc/nginx/conf.d/experiment-locations.conf;
  # }
  
  # HTTP to HTTPS リダイレクト（本番環境用）
  # server {
  #   listen 80;
  #   server_name your-experiment-domain.com;
  #   return 301 https://$server_name$request_uri;
  # }
}

# --- 管理者通知例 ---
# error_logやaccess_logを監視し、429や5xxが急増した場合は外部通知サービス（Slack, Teams, メール等）と連携推奨
# 例: log監視用スクリプト + curl/slack APIで自動通知
# cronで毎日ログgrepし、異常時のみ通知
