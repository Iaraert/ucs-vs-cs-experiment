# UCS vs CS 認知実験用 Nginx設定 (最適化版)
# 参加者200-300人、同時接続最大30人対応
# 最終更新: 2025-06-14
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

# 認知実験に最適化されたリソース設定
worker_rlimit_nofile 2048;

events {
  # 30人同時接続 + 管理・監視用バッファ（余裕を持った設定）
  worker_connections 256;
  # 効率的な接続処理（Linux環境用）
  use epoll;
  multi_accept on;
  # 低負荷環境のため accept_mutex は有効
  accept_mutex on;
}

http {
  # 基本設定
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  # ログ形式（認知実験に最適化 - 必要な情報のみ）
  log_format experiment '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent rt=$request_time '
                       'exp_session="$cookie_session_id"';
  
  access_log /var/log/nginx/experiment_access.log experiment;
  
  # パフォーマンス最適化（認知実験向け調整）
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 20;
  keepalive_requests 50;
  types_hash_max_size 1024;
  
  # 基本セキュリティヘッダー（シンプル化）
  server_tokens off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  
  # レート制限（認知実験に最適化）
  limit_req_zone $binary_remote_addr zone=experiment:5m rate=3r/s;
  limit_req_zone $binary_remote_addr zone=api:5m rate=8r/s;
  limit_req_zone $binary_remote_addr zone=submit:5m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=addr:5m;
  
  # 接続制限（1人あたり最大2接続）
  limit_conn addr 2;
  
  # バッファサイズ最適化（認知実験の小さなデータ量に合わせて）
  client_body_buffer_size 16K;
  client_header_buffer_size 1k;
  client_max_body_size 512k;
  large_client_header_buffers 2 4k;
  
  # タイムアウト設定（認知実験の操作時間を考慮して適度に）
  client_body_timeout 20;
  client_header_timeout 10;
  send_timeout 20;
  
  # Gzip圧縮（パフォーマンス向上）
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;
  
  # アップストリーム設定（認知実験用シンプル化）
  upstream experiment_backend {
    server 127.0.0.1:9876 max_fails=1 fail_timeout=5s;
    keepalive 8;
    keepalive_requests 50;
    keepalive_timeout 30s;
  }
  
  server {
    listen 9123;
    server_name INFRA-PRACTICE-NGINX;
    charset UTF-8;
    
    # 基本セキュリティ設定（認知実験に適度な制限）
    if ($request_method !~ ^(GET|POST|HEAD)$) {
      return 405;
    }
    
    # 実験データ保護のためのヘッダー
    add_header X-Experiment-Version "2025.6" always;
    
    # プロキシヘッダー（シンプル化）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # プロキシ設定（認知実験用最適化）
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    proxy_buffering on;
    proxy_buffer_size 32k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    
    # 実験メインページ
    location / {
      limit_req zone=experiment burst=5 nodelay;
      
      proxy_pass http://experiment_backend;
      
      # 実験データの保護（キャッシュ制御）
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }
    
    # データ送信エンドポイント（厳格な制限）
    location ~ ^/(send|send_imc)$ {
      limit_req zone=submit burst=2 nodelay;
      
      proxy_pass http://experiment_backend;
      
      # データ送信の最適化
      proxy_buffering off;
      add_header Cache-Control "no-cache" always;
    }
    
    # API エンドポイント（実験制御用）
    location ~ ^/(getSampleType|getExperimentPath|setSampleType)$ {
      limit_req zone=api burst=10 nodelay;
      
      proxy_pass http://experiment_backend;
      
      # APIレスポンスの最適化
      add_header Cache-Control "no-cache" always;
    }
    
    # ヘルスチェック（制限なし）
    location /health {
      access_log off;
      proxy_pass http://experiment_backend/health;
      
      # ヘルスチェック専用設定
      proxy_connect_timeout 2s;
      proxy_send_timeout 2s;
      proxy_read_timeout 2s;
    }
    
    # 静的ファイル（認知実験用アセット）
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
      proxy_pass http://experiment_backend;
      
      # 静的ファイルのキャッシュ（実験期間中は適度に）
      expires 30m;
      add_header Cache-Control "public, no-transform";
      
      # 圧縮
      gzip_static on;
      
      # セキュリティ
      add_header X-Content-Type-Options "nosniff" always;
    }
    
    # エラーページ（実験環境向け）
    error_page 403 /error/403.html;
    error_page 404 /error/404.html;
    error_page 429 /error/429.html;
    error_page 500 502 503 504 /error/500.html;
    
    # カスタムエラーページの処理
    location ~* ^/error/ {
      internal;
      proxy_pass http://experiment_backend;
      add_header Cache-Control "no-cache" always;
    }
    
    location = /50x.html {
      root /usr/share/nginx/html;
    }
    
    # 実験統計・監視エンドポイント（IP制限推奨）
    location /admin {
      # 本番環境では管理者IPに制限
      # allow 192.168.1.0/24;
      # allow 10.0.0.0/8;
      # deny all;
      
      limit_req zone=experiment burst=5 nodelay;
      proxy_pass http://experiment_backend;
      
      # 管理画面の保護
      add_header X-Admin-Access "monitored" always;
      add_header Cache-Control "no-cache, no-store" always;
    }
  }
  
  # SSL設定（本番環境用 - Let's Encrypt推奨）
  # server {
  #   listen 443 ssl http2;
  #   server_name your-experiment-domain.com;
  #   
  #   # SSL証明書設定
  #   ssl_certificate /etc/letsencrypt/live/your-domain/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
  #   
  #   # SSL設定（認知実験用最適化）
  #   ssl_session_cache shared:SSL:10m;
  #   ssl_session_timeout 10m;
  #   ssl_session_tickets off;
  #   
  #   # 現代的な暗号化設定
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  #   ssl_prefer_server_ciphers off;
  #   
  #   # セキュリティヘッダー
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  #   add_header X-Experiment-Secure "enabled" always;
  #   
  #   # HTTP/2 Push（実験用リソース）
  #   location = / {
  #     http2_push /static/css/examine1.css;
  #     http2_push /static/javascript/examine1.js;
  #   }
  #   
  #   # 上記のlocation設定をここにも適用
  #   include /etc/nginx/conf.d/experiment-locations.conf;
  # }
  
  # HTTP to HTTPS リダイレクト（本番環境用）
  # server {
  #   listen 80;
  #   server_name your-experiment-domain.com;
  #   return 301 https://$server_name$request_uri;
  # }
}
