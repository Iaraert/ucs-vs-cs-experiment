# 共通設定ファイル - UCS vs CS 実験

APP_NAME="UCS vs CS Experiment"
APP_DIR="/opt/ucs-vs-cs-experiment"
APP_PORT=9876
APP_HOST="127.0.0.1"

LOGS_DIR="$APP_DIR/logs"
DATA_DIR="$APP_DIR/data"
TMP_DIR="$APP_DIR/tmp"

VENV_DIR="$APP_DIR/venv-aws"
GUNICORN_BIN="$VENV_DIR/bin/gunicorn"

WSGI_MODULE="wsgi:app"

# タイムアウト（秒）
DEFAULT_TIMEOUT=120
DEFAULT_KEEPALIVE=2

WORKER_TMP_DIR="/dev/shm"

SYSTEMD_DIR="/etc/systemd/system"
SERVICE_RESTART_SEC=30  # 開発環境のデフォルト再起動間隔
SERVICE_START_LIMIT_INTERVAL=600  # 10分間に
SERVICE_START_LIMIT_BURST=3       # 3回まで再起動を許可
