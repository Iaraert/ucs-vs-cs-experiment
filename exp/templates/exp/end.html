<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/end.css') }}"/>
    <title>回答完了ページ</title>
    <style>
      body, textarea {
        user-select: auto !important;
        -webkit-user-select: auto !important;
        -ms-user-select: auto !important;
        -moz-user-select: auto !important;
      }
    </style>
</head>

<body>
    <div id="end_area">
    <h2 id="end_message">実験へのご協力ありがとうございました。</h2>
    </div>
    <div id="reward_area">
    <ul>
        <h3>謝金の受け取りについて</h3>
        <li> 以下のコードを、CrowdWorks上で指定した回答欄に入力して下さい。</li>
        <li><textarea rows = 1 id="complete_code" readonly></textarea><br><button id="copy_button">数字をコピーする</button></li>
        <li>コードが表示されない場合、URLの末尾の「id=」から始まる文字列をコードとしてご利用ください。</li>
        <li>間違ったコードの入力、または入力が無い場合は報酬をお支払いできませんのでご了承ください。</li>
        <li>CrowdWorksへの入力を確認してからページを閉じてください。</li>
    </ul>
    </div>
<script type="module">
import { showCRTExperienceModal, getUserIdFromUrl } from '{{ url_for("static", filename="javascript/utilities.js") }}';

// CRT受験歴アンケートを表示する関数
async function showCRTSurvey() {
  try {
    // URLパラメータからユーザーIDを取得（end.htmlではURLパラメータを隠さない）
    const userId = getUserIdFromUrl(false);
    
    if (!userId) {
      console.warn('showCRTSurvey: ユーザーIDが取得できないため、アンケートをスキップします');
      return;
    }
    
    console.log(`showCRTSurvey: CRT受験歴アンケートを開始 - ユーザーID: ${userId}`);
    
    // CRT受験歴アンケートモーダルを表示
    await showCRTExperienceModal(userId);
    
    console.log('showCRTSurvey: CRT受験歴アンケート完了');
    
  } catch (error) {
    console.error('showCRTSurvey: CRT受験歴アンケートでエラーが発生しました:', error);
    // エラーが発生しても処理を続行
  }
}

// end.htmlでは完了IDとしてURLパラメータを表示するため、URLの変更は行わない
function copy(){
    // コピー時は警告を解除
    window.onbeforeunload = null;
    document.getElementById('complete_code').select();
    return document.execCommand("copy");
}

// DOM読み込み完了時にCRT受験歴アンケートを表示
document.addEventListener('DOMContentLoaded', async function() {
    // CRT受験歴アンケートを最初に実行
    await showCRTSurvey();
    
    // 通常の完了処理を実行
    // 参加済みフラグをセット（再参加防止用）
    document.cookie = "simple_flag=true; path=/; max-age=31536000";
    localStorage.setItem("already_participated", "true");

    var text = document.getElementById('complete_code');
    text.readonly = false;
    text.value = window.location.search.split('=')[1];
    text.readonly = true;
    document.querySelector("#copy_button").addEventListener("click", copy);

    window.onbeforeunload = function(e) {
        e.returnValue = "ページを離れると、これまで入力した内容は全て破棄されます。ページを離れてもよろしいですか？";
    }
    preventBrowserBack();
});

// ブラウザバックを禁止する関数
function preventBrowserBack() {
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', (e) => {
        history.go(1);
    });
}
</script>
</body>

</html>
