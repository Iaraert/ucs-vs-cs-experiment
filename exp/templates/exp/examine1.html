<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回答ページ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/examine1.css') }}"/>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='javascript/examine1.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='javascript/url-cleaner.js') }}"></script>
    <script type="module">
      import { disableSelectionAndCopy } from "../static/javascript/utilities.js";
      disableSelectionAndCopy();
    </script>
    <script>
        // ページ読み込み時にURLパラメータを隠す
        window.addEventListener('DOMContentLoaded', function() {
            try {
                const cleanUrl = window.location.protocol + '//' + 
                                window.location.host + 
                                window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
                // パスも/expに見せかける（履歴は残さない・リロード/直リンクは影響なし）
                const fakePathUrl = window.location.protocol + '//' + window.location.host + '/exp';
                window.history.replaceState({}, document.title, fakePathUrl);
                console.log('examine1: URLパラメータとパスを/expに見せかけました');
            } catch (error) {
                console.error('examine1: URLパラメータまたはパスの非表示に失敗しました:', error);
            }
        });
    </script>
    <script>
window.addEventListener('DOMContentLoaded', function() {
    try {
        const fakePathUrl = window.location.protocol + '//' + window.location.host + '/exp';
        window.history.replaceState({}, document.title, fakePathUrl);
        console.log('examine1: パスを/expに見せかけました');
    } catch (e) {
        console.error('examine1: パス書き換え失敗:', e);
    }
});
</script>

    <style>
        body {
            margin: 0 auto !important;
            left: 0 !important;
            right: 0 !important;
            text-align: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            overflow: hidden;
        }
        #scenario_descriptions {
            text-align: left !important;
        }
        #scenario_descriptions p {
            text-align: left !important;
            display: flex !important;
            justify-content: flex-start !important;
            align-items: flex-start !important;
            width: 100%;
        }
        #scenario_descriptions label {
            text-align: left !important;
            display: inline-block !important;
            width: calc(100% - 30px);
        }
    </style>
</head>

<body>
    <script>window.user_id = "{{ user_id|e }}";</script>
    <div class="container">
        <!-- ヘッダーエリア -->
        <div id="header_area" style="width: 100%; overflow: visible;">
            <div id="scenario_title" class="title" style="white-space: nowrap; overflow: visible;"></div>
            <div id="page"></div>
            <progress id="progress_bar"></progress>
        </div>

        <!-- プリロード表示 -->
        <div id="preload_image">
            <p>ページを読み込んでいます。</p>
            <p>しばらくお待ちください。</p>
        </div>

        <!-- シナリオ説明エリア -->
        <div id="description_area" class="area" style="display:none; text-align: center;">
            <p id="check_sentence" style="display:none;">それぞれの項目を読んだら左側のチェックボックスをチェックし、回答ページに進んでください。</p>
            <br>
            <div id="scenario_descriptions">
                <form action="cgi-bin/abc.cgi" method="post">
                    <p>
                        <input class="checkbox" type="checkbox" id="checkbox1" style="transform:scale(1.5)"
                            onclick="try { check_description(); } catch(e) { console.error('Checkbox error:', e); }" />
                        <label for="checkbox1" id="scenario_description1"></label>
                    </p>
                    <p>
                        <input class="checkbox" type="checkbox" id="checkbox2" style="transform:scale(1.5)"
                            onclick="try { check_description(); } catch(e) { console.error('Checkbox error:', e); }" />
                        <label for="checkbox2" id="scenario_description2"></label>
                    </p>
                    <p>
                        <input class="checkbox" type="checkbox" id="checkbox3" style="transform:scale(1.5)"
                            onclick="try { check_description(); } catch(e) { console.error('Checkbox error:', e); }" />
                        <label for="checkbox3" id="scenario_description3"></label>
                    </p>
                    <p>
                        <input class="checkbox" type="checkbox" id="checkbox4" style="transform:scale(1.5)"
                            onclick="try { check_description(); } catch(e) { console.error('Checkbox error:', e); }" />
                        <label for="checkbox4" id="scenario_description4"></label>
                    </p>
                </form>
            </div>
            <div style="padding: 20px 20px;">
                <button id="start_scenario_button" class="btn" style="cursor:pointer;" 
                    onclick="try { to_next_new_sample_page(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }"
                    disabled>このシナリオを<br>開始する</button>
            </div>
        </div>

        <br>

        <!-- サンプル表示エリア -->
        <div id="show_sample_area" class="area" style="display:none">
            <div id="current_page"></div>

            <div id="horizontal_display">
                <!-- メインコンテンツ: フレーム説明と画像表示を統合 -->
                <div class="main-content-column">
                    <div id="split_display">
                        <!-- 統制群：フレーム説明と画像表示を統合 -->
                        <div class="integrated-group-container control-group">
                            <div class="frame-description control-description" id="non_treated_description"></div>
                            <div class="group-icons" id="non_treated_icons"></div>
                        </div>

                        <!-- 実験群：フレーム説明と画像表示を統合 -->
                        <div class="integrated-group-container experimental-group">
                            <div class="frame-description experimental-description" id="treated_description"></div>
                            <div class="group-icons" id="treated_icons"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 右側: アイコン意味の説明 -->
                <div class="icon-legend-column">
                    <div class="legend-item">
                        <span class="legend-icon" id="positive_icon"></span>
                        <span class="legend-text" id="positive_meaning">症状あり</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon" id="negative_icon"></span>
                        <span class="legend-text" id="negative_meaning">症状なし</span>
                    </div>
                </div>
            </div>

            <!-- スライダーエリア -->
            <div id="response_slider_area" class="slider-container">
                <div id="slider_description">
                    <p>この事例を見て、<span id="slider_scenario_result"></span>と思いますか？</p>
                    <div class="slider-labels">
                        <span id="slider_min_result" class="slider-min-label"></span>
                        <span id="slider_zero_result" class="slider-zero-label"></span>
                        <span id="slider_max_result" class="slider-max-label"></span>
                    </div>
                </div>
                <form oninput="slider_value.value = Number(response_slider.value);">
                    <div class="slider-value-container">
                        <output id="slider_value">0</output>
                    </div>
                    <div class="slider-input-container">
                        <input id="response_slider" type="range" min="-100" max="100" step="1" value="0" disabled>
                        <p id="slider_wait_message" class="wait-message">スライダーは3秒後に操作可能になります...</p>
                        <div style="margin-top: 10px;">
                            <input type="checkbox" id="slider_confirmation_checkbox" style="transform:scale(1.5)" disabled />
                            <label for="slider_confirmation_checkbox">この数値を答えとして回答します（0として回答したい場合でも、一度スライダーを操作してください）</label>
                        </div>
                    </div>
                </form>
            </div>

            <!-- 送信ボタン - スライダー操作後とチェックボックス選択後に有効化 -->
            <button id="submit_response" class="btn" onclick="submitResponseAndContinue();" disabled>回答を送信</button>
            
            <script>
                // スライダー操作とチェックボックスの状態を追跡する変数
                let sliderMoved = false;
                
                // スライダーが操作されたらチェックボックスを有効化
                document.getElementById('response_slider').addEventListener('input', function() {
                    sliderMoved = true;
                    document.getElementById('slider_confirmation_checkbox').disabled = false;
                    updateSubmitButtonState();
                });
                
                // チェックボックスがチェックされたら送信ボタンの状態を更新
                document.getElementById('slider_confirmation_checkbox').addEventListener('change', function() {
                    console.log('スライダー確認チェックボックスの状態が変更されました:', this.checked);
                    updateSubmitButtonState();
                    // チェックボックス処理も実行
                    checkResponseCheckbox(this);
                });
                
                // スライダー操作とチェックボックスの状態に基づいて送信ボタンの有効/無効を設定
                function updateSubmitButtonState() {
                    const isChecked = document.getElementById('slider_confirmation_checkbox').checked;
                    document.getElementById('submit_response').disabled = !(sliderMoved && isChecked);
                }
                
                // リセット関数：シナリオ切り替え時に呼び出し
                window.resetResponseFlow = function() {
                    sliderMoved = false;
                    const cb = document.getElementById('slider_confirmation_checkbox');
                    if (cb) {
                        cb.checked = false;
                        cb.disabled = true;
                    }
                    updateSubmitButtonState();
                };
                
                // チェックボックスがチェックされた際の処理（スライダー用チェックボックスのみ対象）
                async function checkResponseCheckbox(sourceElement) {
                    try {
                        console.log('checkResponseCheckbox: 関数が呼び出されました');
                        
                        // 呼び出し元が指定されていない場合は、イベントターゲットを確認
                        const target = sourceElement || event.target;
                        console.log('checkResponseCheckbox: ターゲット要素:', target ? target.id : 'なし');
                        
                        // スライダー用のチェックボックス（slider_confirmation_checkbox または slider_confirmation_checkbox_legacy）以外では通知しない
                        if (!target || (target.id !== 'slider_confirmation_checkbox' && target.id !== 'slider_confirmation_checkbox_legacy')) {
                            console.log('checkResponseCheckbox: 対象外のチェックボックスからの呼び出しをスキップ');
                            return;
                        }
                        
                        console.log('checkResponseCheckbox: スライダー確認チェックボックスの処理開始, チェック状態:', target.checked);
                        
                        // チェックボックスがチェックされていない場合は処理を終了
                        if (!target.checked) {
                            console.log('checkResponseCheckbox: チェックボックスがチェックされていないため処理を終了');
                            return;
                        }
                        
                        // dataManagerから現在のシナリオ情報を取得
                        let currentIndex = -1;
                        
                        try {
                            // dataManagerが利用可能になるまで少し待つ
                            let maxRetries = 10;
                            let retryCount = 0;
                            
                            while ((!window.dataManager || typeof window.dataManager.getScenarioAssignment !== 'function') && retryCount < maxRetries) {
                                console.log(`checkResponseCheckbox: dataManagerを待機中... (${retryCount + 1}/${maxRetries})`);
                                await new Promise(resolve => setTimeout(resolve, 100)); // 100ms待機
                                retryCount++;
                            }
                            
                            if (window.dataManager && typeof window.dataManager.getScenarioAssignment === 'function') {
                                const scenarioInfo = window.dataManager.getScenarioAssignment();
                                currentIndex = scenarioInfo.currentIndex;
                                console.log('checkResponseCheckbox: dataManagerから現在のシナリオインデックスを取得:', currentIndex);
                            } else if (typeof dataManager !== 'undefined' && typeof dataManager.getScenarioAssignment === 'function') {
                                const scenarioInfo = dataManager.getScenarioAssignment();
                                currentIndex = scenarioInfo.currentIndex;
                                console.log('checkResponseCheckbox: グローバルdataManagerから現在のシナリオインデックスを取得:', currentIndex);
                            } else {
                                // フォールバック: HTMLから直接インデックスを推定
                                console.log('checkResponseCheckbox: dataManagerが見つからないため、HTMLからインデックスを推定');
                                const pageElement = document.getElementById('page');
                                console.log('checkResponseCheckbox: pageElement:', pageElement);
                                if (pageElement && pageElement.innerHTML) {
                                    console.log('checkResponseCheckbox: pageElement.innerHTML:', pageElement.innerHTML);
                                    const match = pageElement.innerHTML.match(/(\d+)\/\d+/);
                                    if (match) {
                                        currentIndex = parseInt(match[1]) - 1; // 0ベースのインデックスに変換
                                        console.log('checkResponseCheckbox: HTMLから現在のシナリオインデックスを推定:', currentIndex);
                                    }
                                }
                            }
                        } catch (dmError) {
                            console.error('checkResponseCheckbox: dataManager取得中にエラー:', dmError);
                        }
                        
                        // インデックスを取得できない場合は処理を終了
                        if (currentIndex === -1) {
                            console.warn('checkResponseCheckbox: シナリオインデックスを取得できませんでした');
                            return;
                        }
                        
                        // 実験形式変更通知のチェック（1つ目のシナリオの場合）
                        if (currentIndex === 0) {
                            try {
                                // ユーザーIDを取得
                                let userId = null;
                                if (window.dataManager && window.dataManager.userId) {
                                    userId = window.dataManager.userId;
                                } else if (typeof dataManager !== 'undefined' && dataManager.userId) {
                                    userId = dataManager.userId;
                                }
                                
                                if (userId) {
                                    // utilities.jsから実験形式変更通知関数をインポート
                                    const { checkAndShowFormatChangeNotification } = await import('../static/javascript/utilities.js');
                                    await checkAndShowFormatChangeNotification(userId, currentIndex, 'examine1');
                                } else {
                                    console.log('checkResponseCheckbox: ユーザーIDが取得できないため実験形式変更通知をスキップ');
                                }
                            } catch (notificationError) {
                                console.warn('checkResponseCheckbox: 実験形式変更通知でエラーが発生しました:', notificationError);
                                // エラーが発生しても処理は継続
                            }
                        }
                        
                        // 通常のチェックボックス処理
                        console.log(`checkResponseCheckbox: シナリオインデックス=${currentIndex}, チェック状態=${target.checked}`);
                    } catch (error) {
                        console.error('checkResponseCheckbox: チェックボックス処理中にエラーが発生しました:', error);
                    }
                }
            </script>
        </div>
        <br>

        <!-- 評価入力エリア -->
        <div id="estimate_input_area" class="area" style="display:none">
            <div id="estimate_description"></div><br>
            <form oninput="estimate.value = Number(estimate_slider.value);">
                <p>
                    <b><output id="estimate">0</output></b>
                </p>
                <div class="slider-container">
                    <div class="slider-input-container">
                        <input id="estimate_slider" type="range" min="-100" max="100" step="1" value="0" onclick="check_estimate()">
                    </div>
                </div>
            </form>
            <br>
            <input type="checkbox" id="slider_confirmation_checkbox_legacy" style="transform:scale(1.5)" disabled onclick="check_estimate()" />
            <label for="slider_confirmation_checkbox_legacy">この数値を答えとして回答します（0として回答したい場合でも、一度スライダーを操作してください）<br></label>
            <script>
                // スライダーが操作されたらチェックボックスを有効化
                document.getElementById('estimate_slider').addEventListener('input', function() {
                    document.getElementById('slider_confirmation_checkbox_legacy').disabled = false;
                });
                
                // 従来UI用のチェックボックスがチェックされた際の処理
                document.getElementById('slider_confirmation_checkbox_legacy').addEventListener('change', function() {
                    console.log('従来UI確認チェックボックスの状態が変更されました:', this.checked);
                    if (this.checked && this.id === 'slider_confirmation_checkbox_legacy') {
                        checkResponseCheckbox(this);
                    }
                });
            </script>
            <div id="notes">
                <b>ボタンは1回押していただくだけで結構です。</b>
                <b>送信に時間がかかる場合がありますので、最低30秒お待ちください。</b>
            </div>
            <button id="next_scenario" class="btn" style="display:none; cursor:pointer;" disabled
                onclick="try { get_value(); to_next_scenario_description(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }">次のシナリオへ進む</button>
            <button id="finish_all_scenarios" class="btn" style="display:none; cursor:pointer;" disabled
                onclick="try { window.onbeforeunload = null; get_value_fin(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }">回答を送信する</button>
            <button id="continue_scenario" class="btn" style="display:inline-grid; cursor:pointer;" disabled 
                onclick="try { get_value(); showStimulation(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }">シナリオを続ける</button>
        </div>
    </div>

    <script>
        $('button').on('click', function() {
            $('body').css("display","none");
            $('body').fadeIn(300);
        });

        // ページ読み込み時の設定
        $(document).ready(function() {
            $('body').css({
                'margin': '0 auto',
                'left': '0',
                'right': '0',
                'overflow': 'auto', // 常にスクロールを許可
                'height': 'auto' // 自動高さに設定
            });
            
            // すべての要素でスクロールを許可
            $('html, body').css('overflow-y', 'auto');
            $('.container').css('overflow-y', 'auto');
            $('#show_sample_area').css('overflow-y', 'auto');
            $('#split_display').css('overflow-y', 'auto');
        });
    </script>
</body>
</html>
