<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/examine1.css') }}"/>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script>
        // ページ読み込み時に実行
        window.onload = async function() {
            // ユーザーID生成/取得関数
            function generateUniqueId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
            }
            
            function saveUserId(userId, persistent = false) {
                sessionStorage.setItem('exp_user_id', userId);
                
                if (persistent) {
                    localStorage.setItem('exp_user_id_persistent', userId);
                }
                
                return userId;
            }
            
            function getOrCreateUserId(options = {}) {
                const { 
                    urlParam = true, 
                    persistent = false 
                } = options;
                
                const urlParams = new URLSearchParams(window.location.search);
                const urlId = urlParams.get('id');
                if (urlParam && urlId) {
                    return saveUserId(urlId, persistent);
                }
                
                const sessionId = sessionStorage.getItem('exp_user_id');
                if (sessionId) {
                    return sessionId;
                }
                
                if (persistent) {
                    const localId = localStorage.getItem('exp_user_id_persistent');
                    if (localId) {
                        return saveUserId(localId, true);
                    }
                }
                
                const newId = generateUniqueId();
                return saveUserId(newId, persistent);
            }
            
            // サーバーから実験経路を取得する関数
            async function fetchExperimentPath(userId, reallocate = false) {
                try {
                    console.log(`実験経路を取得中: ユーザーID=${userId}, reallocate=${reallocate}`);
                    // reallocateパラメータを明示的に設定
                    const response = await fetch(`/getExperimentPath?user_id=${encodeURIComponent(userId)}&reallocate=${reallocate}`);
                    
                    if (!response.ok) {
                        throw new Error(`サーバーエラー: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('実験経路取得結果:', data);
                    
                    return data.pathType || 'order1';
                } catch (error) {
                    console.error('実験経路の取得に失敗しました:', error);
                    alert('実験経路の取得中にエラーが発生しました。ページをリロードして再試行してください。');
                    // エラー時はデフォルトの順序を返す
                    return 'order1';
                }
            }
            
            try {
                // ユーザーIDを取得または生成
                const userId = getOrCreateUserId({ persistent: true });
                console.log('ユーザーID:', userId);
                
                // 実験経路を取得
                const experimentPath = await fetchExperimentPath(userId);
                console.log('実験経路:', experimentPath);
                
                // 経路に基づいて最初の実験ページを決定
                let firstExperimentPage;
                if (experimentPath === 'order1') {
                    // order1: examine1 → examine1_2 → examine2
                    firstExperimentPage = '/examine1';
                    console.log('経路order1を適用: 最初のページは /examine1');
                } else {
                    // order2: examine1_2 → examine1 → examine2
                    firstExperimentPage = '/examine1_2';
                    console.log('経路order2を適用: 最初のページは /examine1_2');
                }
                
                // フォームにイベントリスナーを追加（送信前に遷移先変更）
                document.getElementById('experiment-form').addEventListener('submit', function(e) {
                    e.preventDefault(); // デフォルトの送信をキャンセル
                    
                    // 実験ページに遷移（ユーザーIDをURLパラメータに付与）
                    const url = `${firstExperimentPage}?id=${encodeURIComponent(userId)}`;
                    console.log(`遷移先: ${url}`);
                    window.location.href = url;
                });
            } catch (err) {
                console.error('初期化エラー:', err);
                alert('初期化中にエラーが発生しました。ページをリロードして再試行してください。');
            }
        };
        
        // チェックボックスの確認（統一化された関数）
        function check_agreement2() {
            // 共通化されたチェックボックス確認ロジック
            validateCheckboxesHTML("checks", "button");
        }
        
        // チェックボックス確認の共通関数（HTML内で使用）
        function validateCheckboxesHTML(checkboxClass, targetButtonId) {
            const checkboxes = document.getElementsByClassName(checkboxClass);
            let checkedCount = 0;
            
            for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {
                    checkedCount++;
                }
            }
            
            const targetButton = document.getElementById(targetButtonId);
            if (targetButton) {
                if (checkedCount === checkboxes.length) {
                    targetButton.removeAttribute("disabled");
                } else {
                    targetButton.setAttribute("disabled", true);
                }
            }
        }
    </script>
</head>

<body>
    <div id="start_area">
        <h2 id="start_message">実験開始ページ</h2>
    </div>

    <div id="when_agreeing" style="margin: 20px auto; width: 90%; max-width: 800px;">
        <h3>ありがとうございます。</h3>
        <p>以下の文章を読んで、回答ページに進んで下さい。</p>
        <p>それぞれの項目を読んだら左側のチェックボックスをチェックしてください。</p>

        <div id="scenario_descriptions" style="margin: 20px auto; text-align: left; padding: 10px;">
            <form action="cgi-bin/abc.cgi" method="post">
                <p>
                    <input class="checks" type="checkbox" id="checkbox1" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label for="checkbox1">これから行う実験では、ある要因と結果の関係性について判断していただきます。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox2" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox2">画面には複数の事例が提示されます。それらを見て、要因と結果の間の関係性の強さを評価していただきます。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox3" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox3">実験はいくつかのシナリオに分かれており、各シナリオでは異なる状況での関係性を評価します。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox4" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox4">各シナリオの内容をよく読んだ上で、提示される事例を観察し、最後に0から100の数値で評価を行ってください。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox5" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox5">また、これから提示される結果は架空のものであり、実在の人物や物事などと関係ありません。
                    </label>
                </p>
                <br>
                <p>
                    <input class="checks" type="checkbox" id="checkbox6" style="transform:scale(1.5)"
                        onclick="check_agreement2()" />
                    <label
                        for="checkbox6">回答中のメモなどはお控えください。また、実験中はブラウザの「戻る」ボタンを使用しないでください。
                    </label>
                </p>
            </form>
        </div>
    </div>

    <div style="margin: 30px auto; text-align: center;">
        <form id="experiment-form" style="display: inline-block;">
            <input type="submit" id='button' value="回答を開始する" disabled class="btn">
        </form>
    </div>

    <div style="margin-bottom: 30px;"></div>
</body>
</html>
