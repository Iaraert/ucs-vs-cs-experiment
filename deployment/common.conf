# 共通設定ファイル
# UCS vs CS 実験アプリケーション

# アプリケーション基本設定
APP_NAME="UCS vs CS Experiment"
APP_DIR="/opt/ucs-vs-cs-experiment"
APP_PORT=9876
APP_HOST="127.0.0.1"

# ディレクトリ設定
LOGS_DIR="$APP_DIR/logs"
DATA_DIR="$APP_DIR/data"
TMP_DIR="$APP_DIR/tmp"
CONFIG_DIR="$APP_DIR/config"

# Python/仮想環境設定
VENV_DIR="$APP_DIR/venv-aws"
PYTHON_BIN="$VENV_DIR/bin/python"
PIP_BIN="$VENV_DIR/bin/pip"
GUNICORN_BIN="$VENV_DIR/bin/gunicorn"

# WSGI設定
WSGI_MODULE="wsgi:app"

# デフォルトのタイムアウト設定
DEFAULT_TIMEOUT=120
DEFAULT_KEEPALIVE=2

# ログ設定
LOG_FORMAT='%(h)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s" %(D)s'

# セキュリティ設定
LIMIT_REQUEST_LINE=4096
LIMIT_REQUEST_FIELDS=100
LIMIT_REQUEST_FIELD_SIZE=8190

# パフォーマンス設定
WORKER_TMP_DIR="/dev/shm"
WORKER_CONNECTIONS=1000

# systemd設定
SYSTEMD_DIR="/etc/systemd/system"
SERVICE_RESTART_SEC=30
SERVICE_START_LIMIT_INTERVAL=600
SERVICE_START_LIMIT_BURST=3
