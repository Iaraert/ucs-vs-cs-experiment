<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <link rel="stylesheet" href="{{ url_for('static', filename='css/examine1_2.css') }}"/>    <script type="text/javascript" src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='javascript/examine1_2.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='javascript/url-cleaner.js') }}"></script>
    <script>
        // ページ読み込み時にURLパラメータを隠す
        window.addEventListener('DOMContentLoaded', function() {
            try {
                const cleanUrl = window.location.protocol + '//' + 
                                window.location.host + 
                                window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
                // パスも/expに見せかける（履歴は残さない・リロード/直リンクは影響なし）
                const fakePathUrl = window.location.protocol + '//' + window.location.host + '/exp';
                window.history.replaceState({}, document.title, fakePathUrl);
                console.log('eXaM1nE_2: URLパラメータとパスを/expに見せかけました');
            } catch (error) {
                console.error('eXaM1nE_2: URLパラメータまたはパスの非表示に失敗しました:', error);
            }
        });
    </script>
    <title>回答ページ</title>    <style>
        #scenario_descriptions {
            text-align: left !important;
        }
        #scenario_descriptions p {
            text-align: left !important;
            display: flex !important;
            justify-content: flex-start !important;
            align-items: flex-start !important;
            width: 100%;
        }
        #scenario_descriptions label {
            text-align: left !important;
            display: inline-block !important;
            width: calc(100% - 30px);
        }
        #scenario_descriptions .checkbox {
            margin-right: 2%;
            margin-top: 0.3%;
            flex-shrink: 0;
        }
    </style>
    <script>window.user_id = "{{ user_id|e }}";</script>
</head>

<body>
    <div class="container">
        <div id="header_area">
            <div id="scenario_title" class="title"></div>
            <div id="page"></div>
        </div>
        <div id="preload_image">
            <p>ページを読み込んでいます。</p>
            <p>しばらくお待ちください。</p>
        </div>        <div id="description_area" class="area" style="display:none; text-align: center;">
            <p id="check_sentence" style="display:none;">それぞれの項目を読んだら左側のチェックボックスをチェックし、回答ページに進んでください。</p>
            <br>        <div id="scenario_descriptions" style="text-align: left;">
                <!-- チェックボックスと説明文は動的に生成されます -->
            </div>            <div style="padding: 20px 20px;">
                <button id="start_scenario_button" class="next_button" style="cursor: hand; cursor:pointer;" 
                    onclick="try { to_next_new_sample_page(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }"
                    disabled>このシナリオを<br>開始する</button>
            </div>
        </div>

    <br>

    <div id="show_sample_area" class="area" style="display:none">
        <div id="order"></div>
        <progress id="progress_bar" max="0" value="0"></progress><br>
        <div id="current_page"></div>
        <div id="show_area">
            <table id = "table_area">
            <tr><td>
            <img id="sample_before" class="sample">
            </td><td>
            <img id='arrow' class="sample">
            </td><td>
            <img id="sample_after" class="sample">
            </td></tr>
            <tr><td>
            <span id='first_sentence'></span>
            </td><td>
            </td><td>
            <span id='last_sentence'></span>
            </td></tr>
            </table>
        </div>
          <div id="pred_ans"></div>
        <button id="next_sample" class="next_button"  style="display: none; cursor: hand; cursor:pointer;" 
            onclick="try { to_next_sample(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }">次の事例へ</button>
    </div>
    <script>
        $('button').on('click', function() {
            $('body').css("display","none");
            $('body').fadeIn(300);
        });
    </script>

    <br>
    <div id="estimate_input_area" class="area" style="display:none">
        <div id="estimate_description"></div><br>
        
        <div class="slider-container">
            <div id="slider_description">
                <p>この事例を見て、<span id="slider_scenario_result"></span>と思いますか？</p>
                <div class="slider-labels">
                    <span id="slider_min_result" class="slider-min-label"></span>
                    <span id="slider_max_result" class="slider-max-label"></span>
                </div>
            </div>
              <form oninput="estimate.value = Number(estimate_slider.value);">
                <div class="slider-value-container">
                    <output id="estimate">50</o>
                </div>
                <div class="slider-input-container">
                    <input id="estimate_slider" type="range" min="0" max="100" step="1" value="50" disabled>
                    <p id="slider_wait_message" class="wait-message">スライダーは3秒後に操作可能になります...</p>                    <div style="margin-top: 10px;">
                        <input type="checkbox" id="slider_confirmation_checkbox" style="transform:scale(1.5)" disabled />
                        <label for="slider_confirmation_checkbox">この数値を答えとして回答します（50として回答したい場合でも、一度スライダーを操作してください）</label>
                    </div>
                </div>
            </form>
        </div>
        
        <script>
            // スライダー操作とチェックボックスの状態を追跡する変数
            let sliderMoved = false;
              // スライダーが操作されたらチェックボックスを有効化
            document.getElementById('estimate_slider').addEventListener('input', function() {
                sliderMoved = true;
                document.getElementById('slider_confirmation_checkbox').disabled = false;
                updateSubmitButtonState();
            });            // チェックボックスがチェックされたら送信ボタンの状態を更新
            document.getElementById('slider_confirmation_checkbox').addEventListener('change', function() {
                console.log('スライダー確認チェックボックスの状態が変更されました:', this.checked);
                updateSubmitButtonState();
                // チェックボックス処理も実行
                checkResponseCheckbox(this);
            });
              // スライダー操作とチェックボックスの状態に基づいて送信ボタンの有効/無効を設定
            function updateSubmitButtonState() {
                const isChecked = document.getElementById('slider_confirmation_checkbox').checked;
                const buttons = ['next_scenario', 'continue_scenario', 'finish_all_scenarios'];
                buttons.forEach(buttonId => {
                    const button = document.getElementById(buttonId);
                    if (button) {
                        button.disabled = !(sliderMoved && isChecked);
                    }
                });
            }            // リセット関数：シナリオ切り替え時に呼び出し
            window.resetResponseFlow = function() {
                sliderMoved = false;
                const cb = document.getElementById('slider_confirmation_checkbox');
                const slider = document.getElementById('estimate_slider');
                const waitMessage = document.getElementById('slider_wait_message');
                
                if (cb) {
                    cb.checked = false;
                    cb.disabled = true;
                }if (slider) {
                    slider.disabled = true;
                    slider.value = 50;
                }
                if (waitMessage) {
                    waitMessage.style.display = 'block';
                }
                
                // 出力値をリセット
                const estimate = document.getElementById('estimate');
                if (estimate) {
                    estimate.innerHTML = '50';
                }
                
                updateSubmitButtonState();
                  // 3秒後にスライダーを再度有効化
                setTimeout(function() {
                    if (slider && waitMessage) {
                        slider.disabled = false;
                        waitMessage.style.display = 'none';
                    }
                }, 3000);            };            // チェックボックスがチェックされた際の処理（修正版）
            async function checkResponseCheckbox(sourceElement) {
                try {
                    console.log('checkResponseCheckbox: 関数が呼び出されました');
                    
                    // 呼び出し元が指定されていない場合は、イベントターゲットを確認
                    const target = sourceElement || event.target;
                    console.log('checkResponseCheckbox: ターゲット要素:', target ? target.id : 'なし');
                    
                    // 通常のチェックボックス検証を呼び出し
                    console.log('checkResponseCheckbox: 通常の検証関数を呼び出し');
                    if (typeof check_description === 'function') {
                        await check_description();
                    }
                    
                    // スライダー用のチェックボックス（slider_confirmation_checkbox）の処理
                    if (target && target.id === 'slider_confirmation_checkbox') {
                        console.log('checkResponseCheckbox: スライダー確認チェックボックスの処理開始, チェック状態:', target.checked);
                        
                        // チェックボックスがチェックされていない場合は処理を終了
                        if (!target.checked) {
                            console.log('checkResponseCheckbox: チェックボックスがチェックされていないため処理を終了');
                            return;
                        }
                        
                        // グローバルのexperimentManagerまたはwindow.experimentManagerから現在のシナリオ情報を取得
                        let currentIndex = -1;
                        
                        // デバッグ: experimentManagerの状態を確認
                        console.log('checkResponseCheckbox: window.experimentManager:', window.experimentManager);
                        console.log('checkResponseCheckbox: experimentManager (グローバル):', typeof experimentManager !== 'undefined' ? experimentManager : '未定義');
                        
                        // experimentManagerが利用可能になるまで少し待つ
                        let maxRetries = 10;
                        let retryCount = 0;
                        
                        while ((!window.experimentManager || typeof window.experimentManager.sceIdx === 'undefined') && retryCount < maxRetries) {
                            console.log(`checkResponseCheckbox: experimentManagerを待機中... (${retryCount + 1}/${maxRetries})`);
                            await new Promise(resolve => setTimeout(resolve, 100)); // 100ms待機
                            retryCount++;
                        }
                        
                        if (typeof window.experimentManager !== 'undefined' && window.experimentManager && typeof window.experimentManager.sceIdx !== 'undefined') {
                            currentIndex = window.experimentManager.sceIdx;
                            console.log('checkResponseCheckbox: experimentManagerから現在のシナリオインデックスを取得:', currentIndex);
                        } else if (typeof experimentManager !== 'undefined' && experimentManager && typeof experimentManager.sceIdx !== 'undefined') {
                            currentIndex = experimentManager.sceIdx;
                            console.log('checkResponseCheckbox: グローバルexperimentManagerから現在のシナリオインデックスを取得:', currentIndex);
                        } else {
                            // フォールバック: HTMLから直接インデックスを推定
                            console.log('checkResponseCheckbox: experimentManagerが見つからないため、HTMLからインデックスを推定');
                            const pageElement = document.getElementById('page');
                            console.log('checkResponseCheckbox: pageElement:', pageElement);
                            if (pageElement && pageElement.innerHTML) {
                                console.log('checkResponseCheckbox: pageElement.innerHTML:', pageElement.innerHTML);
                                const match = pageElement.innerHTML.match(/(\d+)\/\d+/);
                                if (match) {
                                    currentIndex = parseInt(match[1]) - 1; // 0ベースのインデックスに変換
                                    console.log('checkResponseCheckbox: HTMLから現在のシナリオインデックスを推定:', currentIndex);
                                }
                            }
                        }
                        
                        // インデックスを取得できない場合は処理を終了
                        if (currentIndex === -1) {
                            console.warn('checkResponseCheckbox: シナリオインデックスを取得できませんでした');
                            return;
                        }
                        
                        // 通常のチェックボックス処理
                        console.log(`checkResponseCheckbox: シナリオインデックス=${currentIndex}, チェック状態=${target.checked}`);
                        return;
                    }
                    
                    // その他のチェックボックスの場合は何もしない
                    console.log('checkResponseCheckbox: 対象外のチェックボックスからの呼び出しをスキップ');
                    
                } catch (error) {
                    console.error('checkResponseCheckbox: チェックボックス処理中にエラーが発生しました:', error);
                }
            }
        </script>
          <div id="notes">
            <b>ボタンは1回押していただくだけで結構です。</b>
        </div>
          <button id="next_scenario" style="display:none; cursor:pointer;" disabled
            onclick="try { get_value(); to_next_scenario_description(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }">次のシナリオへ進む</button>
        <button id="finish_all_scenarios" style="display:none; cursor:pointer;" disabled
            onclick="try { window.onbeforeunload = null; get_value_fin(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }">回答を送信する</button>
        <button id="continue_scenario" style="display:inline-grid; cursor:pointer;" disabled 
            onclick="try { get_value(); showStimulation(); } catch(e) { console.error('Button click error:', e); alert('システムエラーが発生しました。ページを再読み込みしてください。'); }">シナリオを続ける</button>
    </div>
